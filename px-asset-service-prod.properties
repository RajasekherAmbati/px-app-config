spring.application.name=px-asset-service
server.port=8083
spring.profiles.active=dev

services.userServiceBaseUrl=http://localhost:8081
services.accountServiceBaseUrl=http://localhost:8082
services.deviceServiceBaseUrl=http://localhost:8084

# ===============================
# = DataSource Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/PROD
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (optional if using Flyway)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=asset

# -------------------------------
# Resilience4j Circuit Breaker Config
# -------------------------------

# Default circuit breaker settings
resilience4j.circuitbreaker.instances.default.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.default.slidingWindowSize=5
resilience4j.circuitbreaker.instances.default.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.default.failureRateThreshold=50
resilience4j.circuitbreaker.instances.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.default.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.default.automaticTransitionFromOpenToHalfOpenEnabled=true

# Account Service Circuit Breaker
resilience4j.circuitbreaker.instances.accountService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.accountService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.accountService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.accountService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.accountService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Device Service Circuit Breaker
resilience4j.circuitbreaker.instances.deviceService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.deviceService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.deviceService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.deviceService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.deviceService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.deviceService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.deviceService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.deviceService.automaticTransitionFromOpenToHalfOpenEnabled=true

# -------------------------------
# Logging for Circuit Breakers
# -------------------------------
logging.level.io.github.resilience4j.circuitbreaker.CircuitBreaker=INFO
logging.level.io.github.resilience4j.circuitbreaker.internal.CircuitBreakerStateMachine=DEBUG
logging.level.io.github.resilience4j.circuitbreaker.event.CircuitBreakerOnErrorEvent=DEBUG
logging.level.io.github.resilience4j.circuitbreaker.event.CircuitBreakerOnSuccessEvent=DEBUG
logging.level.io.github.resilience4j.circuitbreaker.event.CircuitBreakerOnStateTransitionEvent=DEBUG

# -------------------------------
# WebClient Timeout (Optional)
# -------------------------------
spring.webflux.timeout.connect=5000
spring.webflux.timeout.read=5000
